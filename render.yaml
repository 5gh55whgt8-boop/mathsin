services:
  - type: web
    name: mathlens-ai-api
    runtime: node
    plan: starter
    rootDir: backend
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_NAME
        value: MathLens AI
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_NAME
        value: Administrator
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_OCR_MODEL
        value: gpt-5.6
      - key: OPENAI_OCR_REASONING_EFFORT
        value: high
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_OCR_MODEL
        value: gemini-3.5-flash
      - key: MAX_FILE_SIZE
        value: 20971520
      - key: DB_POOL_MAX
        value: 15
      - key: FREE_SCAN_LIMIT
        value: 3
      - key: TRIAL_DAYS
        value: 7
      - key: PRO_MONTHLY_AMOUNT
        value: 29900
      - key: PRO_CURRENCY
        value: INR
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
