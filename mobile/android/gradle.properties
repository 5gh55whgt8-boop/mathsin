# ============================================================
# Gradle Performance
# ============================================================

org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m

# Reuse Gradle daemon between builds
org.gradle.daemon=true

# Cache Gradle build outputs
org.gradle.caching=true

# Avoid parallel native compilation exhausting RAM
org.gradle.parallel=false
org.gradle.workers.max=2

# ============================================================
# AndroidX
# ============================================================

android.useAndroidX=true

# ============================================================
# Android Build
# ============================================================

# No need for PNG crunching during release builds
android.enablePngCrunchInReleaseBuilds=false

# ============================================================
# React Native - ANDROID PHONE ONLY
# ============================================================

# Modern Android phones use ARM64.
# This avoids compiling x86/x86_64/emulator architectures.
reactNativeArchitectures=arm64-v8a

# Disable New Architecture for faster/simpler native builds
newArchEnabled=true

# Keep Hermes for better runtime performance
hermesEnabled=true

# ============================================================
# Android UI
# ============================================================

edgeToEdgeEnabled=true

# ============================================================
# Expo
# ============================================================

expo.gif.enabled=true
expo.webp.enabled=true
expo.webp.animated=false

# Disable development network inspector unless specifically needed
EX_DEV_CLIENT_NETWORK_INSPECTOR=false

# Standard Expo packaging
expo.useLegacyPackaging=false

expo.inlineModules.watchedDirectories=[]
